# Server Configuration
server.port=8080

# PostgreSQL Connection
spring.application.name=sync-space-backend
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/sync_space
spring.datasource.username=sync_user
spring.datasource.password=Janajeno_2004
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Force Hibernate to use the Dialect we provided
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect