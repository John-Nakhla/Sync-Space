# Server Configuration
server.port=8080

# PostgreSQL Connection
spring.application.name=sync-space-backend
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/sync_space
spring.datasource.username=sync_user
spring.datasource.password=Janajeno_2004
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379


# MongoDB Connection

spring.data.mongodb.uri=mongodb://localhost:27017

# Explicitly define the database name here
spring.data.mongodb.database=sync_space

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Force Hibernate to use the Dialect we provided
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect